# Production overrides for a single host deployment:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Differences from the local stack: APP_ENV=production (the app refuses to start with any
# development secret), no demo seed, every secret must be set in .env (compose fails fast on a
# missing one), only the API port is published, no RabbitMQ management UI, no test receiver and
# no test database. Put TLS in front of port 8000 (a reverse proxy or the platform's load balancer)
# and keep /metrics off the public internet.

x-prod-env: &prod-env
  APP_ENV: production
  SEED_DEMO_DATA: "false"
  ACMETEL_SIGNING_SECRET: ${ACMETEL_SIGNING_SECRET:?set ACMETEL_SIGNING_SECRET in .env}
  VOXLY_SIGNING_SECRET: ${VOXLY_SIGNING_SECRET:?set VOXLY_SIGNING_SECRET in .env}

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: !reset []
    volumes: !override
      - pgdata:/var/lib/postgresql/data

  redis:
    ports: !reset []

  rabbitmq:
    image: rabbitmq:4.1-alpine
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports: !reset []

  migrate:
    environment: *prod-env

  api:
    environment: *prod-env

  worker:
    environment: *prod-env
    ports: !reset []

  beat:
    environment: *prod-env

  receiver:
    # Test double only; start it explicitly with --profile test.
    profiles: ["test"]
